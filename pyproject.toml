[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-coursera-scraper"
version = "0.1.0"
description = "Coursera scraper for Python and the command line: course search by keyword with partner, rating, exact review count, level, duration, skills and product type (course, specialization, certificate, degree), as JSON or CSV. Free and open source; sign in with your QuanticData account, no proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["coursera-scraper", "coursera", "coursera-api", "coursera-courses", "online-courses", "course-data", "mooc", "edtech", "education-data", "web-scraping", "scraper", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
coursera-scraper = "quanticdata_coursera_scraper.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/coursera-scraper-api/?utm_source=github&utm_medium=pypi&utm_campaign=coursera-scraper"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/coursera-scraper"
Issues = "https://github.com/quantumproxies/coursera-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_coursera_scraper" = ["spec.json", "py.typed"]
